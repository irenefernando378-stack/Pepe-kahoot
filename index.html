
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEPE · Il Grande Quizzone Italiano</title>

<style>
:root{
  --wine:#722b42;
  --gold:#8a806f;
  --ink:#463b40;
  --paper:#f8f3eb;
  --line:#dfd2c6;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
}

.wrap{
  max-width:1150px;
  margin:auto;
  padding:20px 26px 55px;
}

/* INTESTAZIONE PEPE */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:10px 0 28px;
  border-bottom:2px solid #d6c5b6;
}

.brand-block{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  min-width:0;
}

.logo{
  font-family:Georgia,'Times New Roman',serif;
  font-size:clamp(49px,9vw,92px);
  font-weight:bold;
  line-height:1;
  letter-spacing:.12em;
  color:var(--wine);
  white-space:nowrap;
}

.restaurant{
  font-family:Arial,sans-serif;
  font-size:clamp(9px,1.8vw,19px);
  font-weight:700;
  letter-spacing:.22em;
  color:var(--wine);
  margin-top:16px;
  white-space:nowrap;
}

.languages{
  display:flex;
  align-items:center;
  flex-shrink:0;
  gap:2px;
  padding:7px;
  background:#eadbcc;
  border:2px solid #dcc8b8;
  border-radius:100px;
}

.languages button{
  background:transparent;
  color:#8b716d;
  border:0;
  border-radius:100px;
  padding:14px 18px;
  font-family:Arial,sans-serif;
  font-size:clamp(12px,2vw,20px);
  font-weight:800;
  cursor:pointer;
}

.languages button.active{
  background:var(--wine);
  color:white;
}

/* TITOLO */
.hero{
  text-align:center;
  padding:55px 0 30px;
}

.hero h1{
  margin:0;
  line-height:.89;
  font-weight:400;
  text-transform:uppercase;
}

.hero .grande{
  display:block;
  color:var(--wine);
  font-size:clamp(64px,12vw,148px);
  letter-spacing:-.055em;
}

.hero .quizzone{
  display:block;
  color:var(--gold);
  font-size:clamp(54px,11vw,132px);
  font-style:italic;
  letter-spacing:-.075em;
}

.hero .italiano{
  display:block;
  color:var(--gold);
  font-size:clamp(58px,11vw,138px);
  font-style:italic;
  letter-spacing:-.065em;
}

.subtitle{
  margin:28px 0 0;
  color:var(--wine);
  font-size:clamp(28px,5vw,57px);
  font-style:italic;
}

.minihero{
  text-align:center;
  margin:26px auto 20px;
  border-bottom:1px solid var(--line);
  padding-bottom:22px;
}

.minihero .heading{
  color:var(--wine);
  font-size:clamp(26px,5vw,49px);
  line-height:1.05;
  text-transform:uppercase;
}

.minihero .heading em{
  color:var(--gold);
  font-weight:400;
}

.minihero .sub{
  margin-top:8px;
  color:var(--wine);
  font-style:italic;
  font-size:18px;
}

/* ELEMENTI DEL GIOCO */
.card{
  background:#fffdf9;
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px;
  margin:18px auto;
  max-width:950px;
  box-shadow:0 10px 35px #722b4209;
}

h2{
  font-weight:400;
  color:var(--wine);
  font-size:clamp(27px,4vw,40px);
}

p{line-height:1.5}

button,input,select{
  font:inherit;
  padding:13px 16px;
  border-radius:6px;
  border:1px solid var(--line);
}

button{
  background:var(--wine);
  color:white;
  border:0;
  font-family:Arial,sans-serif;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

button.alt{
  background:#e9ded3;
  color:var(--wine);
}

input{
  width:100%;
  max-width:420px;
  background:white;
}

select{background:white}
.center{text-align:center}
.muted{color:#8b756b}

.pin{
  font:700 clamp(55px,9vw,110px) Arial,sans-serif;
  letter-spacing:.1em;
  color:var(--wine);
}

.teams{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.team{
  padding:13px 20px;
  border:1px solid var(--line);
  background:white;
  border-radius:8px;
  font-family:Arial,sans-serif;
  font-weight:bold;
}

/* NUOVI COLORI DELLE RISPOSTE */
.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.answer{
  padding:25px;
  text-align:left;
  min-height:100px;
  font-size:clamp(17px,2vw,24px);
  border-radius:9px;
  color:white;
  font-family:Arial,sans-serif;
  font-weight:700;
  overflow-wrap:anywhere;
}

.answer:nth-child(1){
  background:#722b42;
}

.answer:nth-child(2){
  background:#b99a80;
  color:#30252a;
}

.answer:nth-child(3){
  background:#936478;
}

.answer:nth-child(4){
  background:#746157;
}

.answer.chosen{
  outline:4px solid #35262b;
  outline-offset:3px;
}

.answer:disabled{
  opacity:.8;
}

.bar{
  height:23px;
  background:#e9dcd0;
  border-radius:6px;
  overflow:hidden;
}

.bar>div{
  height:100%;
  background:#b48979;
}

.bar .right{
  background:#722b42;
}

.result{
  margin:17px 0;
}

.resultline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
}

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:25px;
}

.big{
  font-size:clamp(30px,4vw,58px);
}

.timer{
  font:700 48px Arial,sans-serif;
  color:var(--wine);
}

.podium{
  display:grid;
  gap:12px;
}

.podium>div{
  padding:20px;
  background:#f0e3d3;
  border-radius:8px;
  font-size:24px;
}

.error{
  color:#bd243a;
  min-height:22px;
}

.small{font-size:13px}

.qr{
  width:200px;
  height:200px;
  object-fit:contain;
  background:white;
  padding:8px;
  border-radius:10px;
}

a{color:var(--wine)}

.question-title{
  font-size:clamp(30px,5vw,58px);
  text-align:center;
  line-height:1.1;
  margin:25px 0 30px;
}

/* TELEFONO */
@media(max-width:650px){
  .wrap{
    padding:13px 13px 40px;
  }

  .top{
    gap:5px;
    padding:12px 0 22px;
  }

  .logo{
    font-size:clamp(37px,9vw,55px);
    letter-spacing:.07em;
  }

  .restaurant{
    font-size:clamp(7px,1.65vw,10px);
    letter-spacing:.10em;
    margin-top:10px;
  }

  .languages{
    padding:4px;
    gap:0;
  }

  .languages button{
    font-size:12px;
    padding:10px 11px;
  }

  .hero{
    padding-top:55px;
  }

  .hero .grande{
    font-size:clamp(55px,15vw,90px);
  }

  .hero .quizzone{
    font-size:clamp(48px,13vw,78px);
  }

  .hero .italiano{
    font-size:clamp(52px,14vw,85px);
  }

  .answers{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
  }

  .answer{
    min-height:75px;
  }
}

@media(max-width:370px){
  .logo{font-size:34px}
  .restaurant{font-size:7px}

  .languages button{
    padding:9px 8px;
    font-size:11px;
  }
}
</style>
</head>

<body>
<div class="wrap">

<header class="top">
  <div class="brand-block">
    <div class="logo">PEPE</div>
    <div class="restaurant">ITALIENSK RESTAURANG</div>
  </div>

  <nav class="languages" aria-label="Lingua">
    <button type="button" data-lang="sv"
      onclick="changeLanguage('sv')">SV</button>
    <button type="button" data-lang="it"
      onclick="changeLanguage('it')">IT</button>
    <button type="button" data-lang="en"
      onclick="changeLanguage('en')">EN</button>
  </nav>
</header>

<main id="app"></main>
</div>

<script>
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);

let pin = params.get('pin') || '';
let role = params.get('role') || '';
let token = '';
let state = null;
let stream = null;
let chosen = null;
let duration = 20;

let lang = localStorage.getItem('pepe-language') || 'it';

if (!['it','sv','en'].includes(lang)) {
  lang = 'it';
}

const esc = s => String(s ?? '').replace(
  /[&<>"']/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const txt = {
  it:{
    hero1:'IL GRANDE',
    hero2:'QUIZZONE',
    hero3:'ITALIANO',
    tag:'Quanto sei italiano?',
    host:'Sono il presentatore',
    player:'Entra come squadra',
    create:'CREA UNA PARTITA',
    time:'Tempo per domanda',
    seconds:'secondi',
    createButton:'CREA PARTITA',
    enter:'ENTRA NEL QUIZ',
    pin:'PIN della partita',
    team:'Nome della squadra',
    enterButton:'ENTRA NELLA PARTITA',
    joined:'SEI NELLA PARTITA!',
    wait:'Attendi che il presentatore inizi…',
    teams:'squadre iscritte',
    start:'INIZIA QUIZ',
    visit:'Vai su',
    scan:'o scansiona il QR code',
    qrHelp:'Se il QR non compare, condividi il link:',
    question:'DOMANDA',
    next:'PROSSIMA DOMANDA',
    correct:'Risposta corretta',
    show:'MOSTRA RISULTATI ORA',
    final:'PODIO FINALE',
    ranking:'CLASSIFICA',
    answered:'squadre hanno risposto',
    sent:'Risposta inviata!',
    select:'Seleziona una risposta',
    winner:'VINCITORE',
    restart:'NUOVA PARTITA',
    points:'punti',
    connection:'Connessione persa',
    connectionHelp:'Controlla il PIN o il server.'
  },

  sv:{
    hero1:'DET STORA',
    hero2:'ITALIENSKA',
    hero3:'QUIZET',
    tag:'Hur italiensk är du?',
    host:'Jag är spelledare',
    player:'Gå med som lag',
    create:'SKAPA ETT SPEL',
    time:'Tid per fråga',
    seconds:'sekunder',
    createButton:'SKAPA SPEL',
    enter:'GÅ MED I QUIZET',
    pin:'Spelkod',
    team:'Lagnamn',
    enterButton:'GÅ MED I SPELET',
    joined:'DU ÄR MED!',
    wait:'Vänta tills spelledaren startar…',
    teams:'lag har gått med',
    start:'STARTA QUIZET',
    visit:'Gå till',
    scan:'eller skanna QR-koden',
    qrHelp:'Om QR-koden inte visas, dela länken:',
    question:'FRÅGA',
    next:'NÄSTA FRÅGA',
    correct:'Rätt svar',
    show:'VISA RESULTAT NU',
    final:'SLUTRESULTAT',
    ranking:'TOPPLISTA',
    answered:'lag har svarat',
    sent:'Svaret har skickats!',
    select:'Välj ett svar',
    winner:'VINNARE',
    restart:'NYTT SPEL',
    points:'poäng',
    connection:'Anslutningen bröts',
    connectionHelp:'Kontrollera spelkoden eller servern.'
  },

  en:{
    hero1:'THE GREAT',
    hero2:'ITALIAN',
    hero3:'QUIZ',
    tag:'How Italian are you?',
    host:'I am the host',
    player:'Join as a team',
    create:'CREATE A GAME',
    time:'Time per question',
    seconds:'seconds',
    createButton:'CREATE GAME',
    enter:'JOIN THE QUIZ',
    pin:'Game PIN',
    team:'Team name',
    enterButton:'JOIN GAME',
    joined:'YOU ARE IN!',
    wait:'Wait for the host to start…',
    teams:'teams joined',
    start:'START QUIZ',
    visit:'Visit',
    scan:'or scan the QR code',
    qrHelp:'If the QR code does not appear, share this link:',
    question:'QUESTION',
    next:'NEXT QUESTION',
    correct:'Correct answer',
    show:'SHOW RESULTS NOW',
    final:'FINAL PODIUM',
    ranking:'LEADERBOARD',
    answered:'teams have answered',
    sent:'Answer submitted!',
    select:'Choose an answer',
    winner:'WINNER',
    restart:'NEW GAME',
    points:'points',
    connection:'Connection lost',
    connectionHelp:'Check the PIN or server.'
  }
};

function updateLanguageButtons() {
  document.documentElement.lang = lang;

  document.querySelectorAll('.languages button')
    .forEach(button => {
      const active = button.dataset.lang === lang;

      button.classList.toggle('active', active);
      button.setAttribute(
        'aria-pressed',
        String(active)
      );
    });
}

function changeLanguage(newLang) {
  if (!txt[newLang]) return;

  lang = newLang;

  localStorage.setItem('pepe-language', lang);
  updateLanguageButtons();

  // Ogni telefono apre il proprio collegamento
  // nella lingua selezionata.
  if (state && pin && role) {
    connect();
    render();
  } else if (role === 'host') {
    setupHost();
  } else if (role === 'player') {
    setupPlayer();
  } else {
    home();
  }
}

function hero() {
  const t = txt[lang];

  return `
    <div class="hero">
      <h1>
        <span class="grande">${t.hero1}</span>
        <span class="quizzone">${t.hero2}</span>
        <span class="italiano">${t.hero3}</span>
      </h1>
      <p class="subtitle">${t.tag}</p>
    </div>
  `;
}

function miniHero() {
  const t = txt[lang];

  return `
    <div class="minihero">
      <div class="heading">
        ${t.hero1}
        <em>${t.hero2} ${t.hero3}</em>
      </div>
      <div class="sub">${t.tag}</div>
    </div>
  `;
}

async function api(url, data) {
  const response = await fetch(url, {
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify(data)
  });

  const result = await response.json();

  if (!response.ok) {
    throw Error(result.error || 'Errore');
  }

  return result;
}

function error(e) {
  const element = document.getElementById('err');

  if (element) {
    element.textContent = e.message || e;
  }
}

function home() {
  const t = txt[lang];

  app.innerHTML = hero() + `
    <section class="card center">
      <div class="controls">
        <button onclick="setupHost()">
          ${t.host}
        </button>
        <button class="alt" onclick="setupPlayer()">
          ${t.player}
        </button>
      </div>
    </section>
  `;
}

function setupHost() {
  role = 'host';

  const t = txt[lang];

  const options = [10,20,30,45,60]
    .map(seconds => `
      <option value="${seconds}"
        ${seconds === duration ? 'selected' : ''}>
        ${seconds} ${t.seconds}
      </option>
    `).join('');

  app.innerHTML = miniHero() + `
    <section class="card center">
      <h2>${t.create}</h2>
      <p>${t.time}</p>

      <select id="seconds"
        onchange="duration=+this.value">
        ${options}
      </select>

      <div class="controls">
        <button onclick="create()">
          ${t.createButton}
        </button>
      </div>

      <p id="err" class="error"></p>
    </section>
  `;
}

async function create() {
  try {
    duration = +document.getElementById('seconds').value;

    const result = await api('/api/create', {
      lang:'it'
    });

    pin = result.pin;
    token = result.token;
    state = null;

    sessionStorage.setItem(
      'pepe-host-' + pin,
      token
    );

    history.replaceState(
      {},
      '',
      '/?role=host&pin=' + pin
    );

    connect();

  } catch (e) {
    error(e);
  }
}

function setupPlayer() {
  role = 'player';

  const t = txt[lang];

  const savedName = pin
    ? sessionStorage.getItem('pepe-name-' + pin) || ''
    : '';

  app.innerHTML = miniHero() + `
    <section class="card center">
      <h2>${t.enter}</h2>

      <p>${t.pin}</p>
      <input
        id="pinInput"
        inputmode="numeric"
        maxlength="6"
        placeholder="123456"
        value="${esc(pin)}"
      >

      <p>${t.team}</p>
      <input
        id="teamInput"
        maxlength="32"
        placeholder="Team Pizza"
        value="${esc(savedName)}"
      >

      <div class="controls">
        <button onclick="join()">
          ${t.enterButton}
        </button>
      </div>

      <p id="err" class="error"></p>
    </section>
  `;
}

async function join() {
  try {
    const p = document.getElementById('pinInput')
      .value.trim();

    const name = document.getElementById('teamInput')
      .value.trim();

    const result = await api('/api/join', {
      pin:p,
      name
    });

    pin = result.pin;
    token = result.token;
    state = null;

    sessionStorage.setItem(
      'pepe-player-' + pin,
      token
    );

    sessionStorage.setItem(
      'pepe-name-' + pin,
      name
    );

    history.replaceState(
      {},
      '',
      '/?role=player&pin=' + pin
    );

    connect();

  } catch (e) {
    error(e);
  }
}

function connect() {
  if (stream) {
    stream.close();
  }

  // QUESTA È LA MODIFICA IMPORTANTE:
  // il server riceve la lingua di questo telefono.
  const url =
    '/events?pin=' + encodeURIComponent(pin) +
    '&lang=' + encodeURIComponent(lang);

  stream = new EventSource(url);

  stream.onmessage = event => {
    const oldIndex = state?.index;
    const oldPhase = state?.phase;

    state = JSON.parse(event.data);

    if (
      state.phase === 'question' &&
      (
        oldIndex !== state.index ||
        oldPhase !== 'question'
      )
    ) {
      chosen = null;
    }

    render();
  };

  stream.onerror = () => {
    if (!state) {
      const t = txt[lang];

      app.innerHTML = miniHero() + `
        <div class="card center">
          <h2>${t.connection}</h2>
          <p>${t.connectionHelp}</p>
        </div>
      `;
    }
  };
}

async function control(action) {
  try {
    await api('/api/control', {
      pin,
      token,
      action,
      duration:duration * 1000
    });
  } catch (e) {
    alert(e.message);
  }
}

async function answer(number) {
  try {
    await api('/api/answer', {
      pin,
      token,
      answer:number
    });

    chosen = number;
    render();

  } catch (e) {
    alert(e.message);
  }
}

function render() {
  if (!state) return;

  const t = txt[lang];
  const host = role === 'host';

  const me = sessionStorage.getItem(
    'pepe-name-' + pin
  );

  const prefix = miniHero();

  // SALA D'ATTESA
  if (state.phase === 'lobby') {
    const url =
      location.origin +
      '/?role=player&pin=' + pin;

    app.innerHTML = prefix + `
      <section class="card center">
        <h2>${host ? t.enterButton : t.joined}</h2>

        ${host ? `
          <p>
            ${t.visit}
            <b>${esc(location.host)}</b>
            ${t.scan}
          </p>

          <img
            class="qr"
            alt="QR"
            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}"
          >

          <p class="muted small">
            ${t.qrHelp}
            <a href="${esc(url)}">${esc(url)}</a>
          </p>
        ` : `
          <p>
            ${t.team}: <b>${esc(me)}</b>
          </p>
          <p>${t.wait}</p>
        `}

        <div class="pin">${esc(pin)}</div>

        <h2>
          ${state.teams.length} ${t.teams}
        </h2>

        <div class="teams">
          ${state.teams.map(team => `
            <span class="team">
              ${esc(team.name)}
            </span>
          `).join('')}
        </div>

        ${host ? `
          <div class="controls">
            <button onclick="control('start')">
              ${t.start}
            </button>
          </div>
        ` : ''}
      </section>
    `;

    return;
  }

  // CLASSIFICA FINALE
  if (state.phase === 'end') {
    const ranking = [...state.teams]
      .sort((a,b) => b.score - a.score);

    app.innerHTML = prefix + `
      <section class="card center">
        <h2>🏆 ${t.winner}!</h2>

        <h2 class="big">
          ${esc(ranking[0]?.name || '')}
        </h2>

        <div class="podium">
          ${ranking.map((team,i) => `
            <div>
              ${['🥇','🥈','🥉'][i] || '⭐'}
              ${esc(team.name)}
              —
              ${team.score} ${t.points}
            </div>
          `).join('')}
        </div>

        ${host ? `
          <div class="controls">
            <button onclick="control('restart')">
              ${t.restart}
            </button>
          </div>
        ` : ''}
      </section>
    `;

    return;
  }

  // DOMANDE GIÀ TRADOTTE DAL SERVER
  const q = state.question || {q:'',a:[]};

  const remaining = Math.max(
    0,
    Math.ceil(
      (state.deadline - Date.now()) / 1000
    )
  );

  const isResults = state.phase === 'results';

  let controls = '';

  if (host) {
    controls = `
      <div class="controls">
        ${isResults ? `
          <button onclick="control('next')">
            ${
              state.index === state.total - 1
                ? t.final
                : t.next + ' →'
            }
          </button>
        ` : `
          <button class="alt"
            onclick="control('reveal')">
            ${t.show}
          </button>
        `}
      </div>
    `;
  }

  let content = '';

  // RISULTATI
  if (isResults) {
    content = `
      <h2 class="center">
        ✓ ${t.correct}:
        ${esc(q.a[state.correct] ?? '')}
      </h2>

      ${q.a.map((answerText,i) => {
        const count = state.counts?.[i] ?? 0;
        const total = state.teams.length;

        const pct = total
          ? Math.round(count / total * 100)
          : 0;

        return `
          <div class="result">
            <div class="resultline">
              <b>
                ${'ABCD'[i]}.
                ${esc(answerText)}
                ${i === state.correct ? '✓' : ''}
              </b>
              <b>${pct}% (${count})</b>
            </div>

            <div class="bar">
              <div
                class="${i === state.correct ? 'right' : ''}"
                style="width:${pct}%"
              ></div>
            </div>
          </div>
        `;
      }).join('')}
    `;

  // PRESENTATORE
  } else if (host) {
    content = `
      <p class="center timer" id="timer">
        ${remaining}s
      </p>

      <div class="answers">
        ${q.a.map((answerText,i) => `
          <div class="answer">
            <b>${'ABCD'[i]}.</b>
            ${esc(answerText)}
          </div>
        `).join('')}
      </div>

      <h2 class="center">
        ${state.answered}
        /
        ${state.teams.length}
        ${t.answered}
      </h2>
    `;

  // SQUADRA
  } else {
    const hasAnswered = state.teams
      .find(team => team.name === me)?.answered;

    content = `
      <p class="center timer" id="timer">
        ${remaining}s
      </p>

      <div class="answers">
        ${q.a.map((answerText,i) => `
          <button
            class="answer ${chosen === i ? 'chosen' : ''}"
            ${hasAnswered ? 'disabled' : ''}
            onclick="answer(${i})"
          >
            <b>${'ABCD'[i]}.</b>
            ${esc(answerText)}
          </button>
        `).join('')}
      </div>

      <p class="center">
        ${hasAnswered ? t.sent : t.select}
      </p>
    `;
  }

  const ranking = [...state.teams]
    .sort((a,b) => b.score - a.score);

  app.innerHTML = prefix + `
    <section class="card">
      <p class="center muted">
        PEPE ✦ ${t.question}
        ${state.index + 1}/${state.total}
        · PIN ${esc(pin)}
      </p>

      <h2 class="question-title">
        ${esc(q.q)}
      </h2>

      ${content}
      ${controls}
    </section>

    ${isResults ? `
      <section class="card center">
        <h2>${t.ranking}</h2>

        <div class="teams">
          ${ranking.map((team,i) => `
            <span class="team">
              ${i + 1}.
              ${esc(team.name)}
              ·
              ${team.score}
            </span>
          `).join('')}
        </div>
      </section>
    ` : ''}
  `;
}

// TIMER VISIVO
setInterval(() => {
  const element = document.getElementById('timer');

  if (
    element &&
    state?.phase === 'question'
  ) {
    element.textContent = Math.max(
      0,
      Math.ceil(
        (state.deadline - Date.now()) / 1000
      )
    ) + 's';
  }
}, 250);

// AVVIO
updateLanguageButtons();

if (pin && role) {
  token = sessionStorage.getItem(
    'pepe-' + role + '-' + pin
  ) || '';

  if (token) {
    connect();
  } else if (role === 'player') {
    setupPlayer();
  } else {
    setupHost();
  }
} else {
  home();
}
</script>
</body>
</html>
