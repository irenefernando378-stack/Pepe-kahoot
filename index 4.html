<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPE · Quiz a squadre</title><style>*{box-sizing:border-box}body{margin:0;background:#f7efe3;color:#412832;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbc5af;padding-bottom:20px}.logo{font:bold 48px Georgia;color:#782238;letter-spacing:.14em}.card{background:#fffaf4;border:1px solid #e4d0b8;border-radius:20px;padding:28px;margin:22px 0;box-shadow:0 12px 40px #78223810}h1,h2{font-family:Georgia;color:#782238}h1{font-size:clamp(36px,5vw,65px);text-align:center}h2{font-size:30px}button,input,select{font:inherit;padding:15px;border-radius:10px;border:1px solid #d8c1a7}button{background:#782238;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.alt{background:#e6d6c5;color:#782238}input{width:100%;max-width:420px;background:white}select{background:white}.center{text-align:center}.muted{color:#8b756b}.pin{font-size:clamp(55px,9vw,110px);font-weight:bold;letter-spacing:.1em;color:#782238}.teams{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.team{padding:13px 20px;border:1px solid #dbc3a9;background:white;border-radius:15px;font-weight:bold}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{padding:25px;text-align:left;min-height:100px;font-size:clamp(17px,2vw,24px);border-radius:14px}.answer:nth-child(1){background:#d63749}.answer:nth-child(2){background:#2478ba}.answer:nth-child(3){background:#c89b15}.answer:nth-child(4){background:#26875c}.answer.chosen{outline:6px solid #272329}.answer:disabled{opacity:.8}.bar{height:23px;background:#e9dcd0;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#b48979}.bar .right{background:#2c955b}.result{margin:17px 0}.resultline{display:flex;justify-content:space-between;margin-bottom:6px}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:25px}.big{font-size:clamp(30px,4vw,58px)}.timer{font-size:48px;font-weight:bold;color:#782238}.podium{display:grid;gap:12px}.podium>div{padding:20px;background:#f0e3d3;border-radius:12px;font-size:24px}.hide{display:none!important}.error{color:#bd243a;min-height:22px}.small{font-size:13px}.qr{width:200px;height:200px;object-fit:contain;background:white;padding:8px;border-radius:10px}a{color:#782238}@media(max-width:650px){.answers{grid-template-columns:1fr}.wrap{padding:13px}.card{padding:17px}.answer{min-height:75px}}</style></head><body><div class="wrap"><header class="top"><div class="logo">PEPE</div><div>✦ ITALIAN QUIZ ✦</div></header><main id="app"></main></div><script>
const app=document.getElementById('app'), params=new URLSearchParams(location.search);let pin=params.get('pin')||'',role=params.get('role')||'',token='',state=null,stream=null,chosen=null,duration=20,lang='it';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt={sv:{question:'FRÅGA',next:'NÄSTA FRÅGA',correct:'Rätt svar',join:'GÅ MED',team:'Lagnamn',winner:'VINNARE'},it:{question:'DOMANDA',next:'PROSSIMA DOMANDA',correct:'Risposta corretta',join:'ENTRA',team:'Nome della squadra',winner:'VINCITORE'},en:{question:'QUESTION',next:'NEXT QUESTION',correct:'Correct answer',join:'JOIN',team:'Team name',winner:'WINNER'}};
async function api(url,data){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Errore');return j}function error(e){let x=document.getElementById('err');if(x)x.textContent=e.message||e}
function home(){app.innerHTML=`<section class="card center"><h1>IL GRANDE QUIZ PEPE</h1><p>Gioca a squadre, dal telefono, proprio come Kahoot!</p><div class="controls"><button onclick="setupHost()">🎤 Sono il presentatore</button><button class="alt" onclick="setupPlayer()">📱 Entra come squadra</button></div></section>`}
function setupHost(){role='host';app.innerHTML=`<section class="card center"><h1>CREA UNA PARTITA</h1><p>Lingua delle domande</p><select id="language"><option value="it">Italiano</option></select><p>Tempo per domanda</p><select id="seconds"><option value="10">10 secondi</option><option value="20" selected>20 secondi</option><option value="30">30 secondi</option><option value="45">45 secondi</option><option value="60">60 secondi</option></select><div class="controls"><button onclick="create()">CREA PARTITA</button></div><p id="err" class="error"></p></section>`}
async function create(){try{lang=document.getElementById('language').value;duration=+document.getElementById('seconds').value;let j=await api('/api/create',{lang});pin=j.pin;token=j.token;sessionStorage.setItem('pepe-host-'+pin,token);history.replaceState({},'',`/?role=host&pin=${pin}`);connect()}catch(e){error(e)}}
function setupPlayer(){role='player';app.innerHTML=`<section class="card center"><h1>ENTRA NEL QUIZ</h1><p>PIN della partita</p><input id="pinInput" inputmode="numeric" maxlength="6" placeholder="123456" value="${esc(pin)}"><p>Nome della squadra</p><input id="teamInput" maxlength="32" placeholder="Team Pizza"><div class="controls"><button onclick="join()">ENTRA NELLA PARTITA</button></div><p id="err" class="error"></p></section>`}
async function join(){try{let p=document.getElementById('pinInput').value.trim(),name=document.getElementById('teamInput').value.trim(),j=await api('/api/join',{pin:p,name});pin=j.pin;token=j.token;sessionStorage.setItem('pepe-player-'+pin,token);sessionStorage.setItem('pepe-name-'+pin,name);history.replaceState({},'',`/?role=player&pin=${pin}`);connect()}catch(e){error(e)}}
function connect(){if(stream)stream.close();stream=new EventSource('/events?pin='+encodeURIComponent(pin));stream.onmessage=e=>{state=JSON.parse(e.data);render()};stream.onerror=()=>{if(!state)app.innerHTML='<div class="card center"><h2>Connessione persa</h2><p>Controlla il PIN o il server.</p></div>'}}
async function control(action){try{await api('/api/control',{pin,token,action,duration:duration*1000})}catch(e){alert(e.message)}}
async function answer(n){try{await api('/api/answer',{pin,token,answer:n});chosen=n;render()}catch(e){alert(e.message)}}
function render(){if(!state)return;lang=state.lang;let t=txt[lang],host=role==='host',me=sessionStorage.getItem('pepe-name-'+pin);if(state.phase==='lobby'){let url=location.origin+'/?role=player&pin='+pin;app.innerHTML=`<section class="card center"><h2>${host?'ENTRA NELLA PARTITA':'SEI NELLA PARTITA!'}</h2>${host?`<p>Vai su <b>${esc(location.host)}</b> o scansiona il QR code</p><img class="qr" alt="QR per entrare" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}"><p class="muted small">Se il QR non compare, condividi il link: <a href="${esc(url)}">${esc(url)}</a></p>`:`<p>Squadra: <b>${esc(me)}</b></p><p>Attendi che il presentatore inizi…</p>`}<div class="pin">${esc(pin)}</div><h2>${state.teams.length} squadre iscritte</h2><div class="teams">${state.teams.map(x=>`<span class="team">${esc(x.name)}</span>`).join('')}</div>${host?`<div class="controls"><button onclick="control('start')">▶ INIZIA QUIZ</button></div>`:''}</section>`;return}
if(state.phase==='end'){let ranking=[...state.teams].sort((a,b)=>b.score-a.score);app.innerHTML=`<section class="card center"><h1>🏆 ${t.winner}!</h1><h2 class="big">${esc(ranking[0]?.name||'')}</h2><div class="podium">${ranking.map((x,i)=>`<div>${['🥇','🥈','🥉'][i]||'⭐'} ${esc(x.name)} — ${x.score} punti</div>`).join('')}</div>${host?`<div class="controls"><button onclick="control('restart')">NUOVA PARTITA</button></div>`:''}</section>`;return}
let q=state.question;let remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));let isResults=state.phase==='results';let controls=host?`<div class="controls">${isResults?`<button onclick="control('next')">${state.index===state.total-1?'🏆 PODIO FINALE':t.next+' →'}</button>`:`<button class="alt" onclick="control('reveal')">MOSTRA RISULTATI ORA</button>`}</div>`:'';
let content=isResults?`<h2 class="center">✓ ${t.correct}: ${esc(q.a[state.correct])}</h2>${q.a.map((a,i)=>{let count=state.counts[i],total=state.teams.length,pct=total?Math.round(count/total*100):0;return `<div class="result"><div class="resultline"><b>${'ABCD'[i]}. ${esc(a)} ${i===state.correct?'✓':''}</b><b>${pct}% (${count})</b></div><div class="bar"><div class="${i===state.correct?'right':''}" style="width:${pct}%"></div></div></div>`}).join('')}`:host?`<p class="center timer" id="timer">${remaining}s</p><div class="answers">${q.a.map((a,i)=>`<div class="answer" style="color:white"><b>${'ABCD'[i]}.</b> ${esc(a)}</div>`).join('')}</div><h2 class="center">${state.answered} / ${state.teams.length} squadre hanno risposto</h2>`:`<p class="center timer" id="timer">${remaining}s</p><div class="answers">${q.a.map((a,i)=>`<button class="answer ${chosen===i?'chosen':''}" ${state.teams.find(x=>x.name===me)?.answered?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(a)}</button>`).join('')}</div><p class="center">${state.teams.find(x=>x.name===me)?.answered?'✓ Risposta inviata!':'Seleziona una risposta'}</p>`;
let ranking=[...state.teams].sort((a,b)=>b.score-a.score);app.innerHTML=`<section class="card"><p class="center muted">PEPE ✦ ${t.question} ${state.index+1}/${state.total} · PIN ${pin}</p><h1>${esc(q.q)}</h1>${content}${controls}</section>${isResults?`<section class="card center"><h2>CLASSIFICA</h2><div class="teams">${ranking.map((x,i)=>`<span class="team">${i+1}. ${esc(x.name)} · ${x.score}</span>`).join('')}</div></section>`:''}`;
}
setInterval(()=>{let e=document.getElementById('timer');if(e&&state?.phase==='question')e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s'},250);
if(pin&&role){token=sessionStorage.getItem('pepe-'+role+'-'+pin)||'';if(token)connect();else if(role==='player')setupPlayer();else setupHost()}else home();
</script></body></html>
